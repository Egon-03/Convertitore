# Crea automaticamente l'installazione per Windows su GitHub.
# Dopo ogni modifica (o avviandolo a mano da "Actions"), il file
# ConvertiTutto-Setup-x.y.z.exe si scarica dagli "Artifacts" della build.
name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Crea l'installazione
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: powershell -ExecutionPolicy Bypass -File build\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ConvertiTutto-Setup
          path: build/Output/*.exe
          retention-days: 30
